name: Monitor producción

# Pinguea /api/health cada 5 minutos. Si falla, el workflow falla y GitHub
# notifica por correo al owner (revisa Settings > Notifications > Actions).
# No requiere cuentas externas. Para alertas más ricas, conecta UptimeRobot
# apuntando al mismo endpoint.
on:
  schedule:
    # Cada 30 min: ~1.450 min/mes de Actions, dentro de los 2.000 gratuitos de
    # repos privados. Con */5 la cuota se agotaba a inicios de mes y GitHub
    # cancelaba los runs (visto 2026-08-06).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: monitor-produccion
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="${{ vars.APP_URL || 'https://oicp-production.up.railway.app' }}/api/health"
          echo "Comprobando $URL"
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 25 "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/body || true
          if [ "$code" != "200" ]; then
            echo "::error::Healthcheck falló con HTTP $code"
            exit 1
          fi
          if ! grep -q '"status":"ok"' /tmp/body; then
            echo "::error::Healthcheck respondió 200 pero sin status ok"
            exit 1
          fi
          echo "OK"

      # Nada vigilaba que los DATOS avanzaran: la sincronización podía morir semanas
      # (ya pasó: la laptop se dormía) y el monitor seguía en verde porque la app
      # respondía perfectamente con datos viejos. Esto falla si el corte de datos se
      # queda atrás o si la base arranca vacía tras una recuperación por corrupción.
      - name: Vigilar frescura de los datos
        run: |
          URL="${{ vars.APP_URL || 'https://oicp-production.up.railway.app' }}/api/version"
          curl -s --max-time 25 "$URL" -o /tmp/ver || { echo "::error::/api/version no respondió"; exit 1; }
          cat /tmp/ver

          CUTOFF=$(grep -o '"dataCutoff":"[^"]*"' /tmp/ver | cut -d'"' -f4)
          PROCS=$(grep -o '"processes":[0-9]*' /tmp/ver | cut -d: -f2)

          if [ -z "$CUTOFF" ] || [ -z "$PROCS" ]; then
            echo "::error::/api/version no trae dataCutoff o processes"; exit 1
          fi

          # Base vacía o casi: síntoma de arranque tras corrupción. La app responde "ok"
          # igual, así que sin esta comprobación la caída de datos pasa inadvertida.
          if [ "$PROCS" -lt 1000000 ]; then
            echo "::error::La base tiene solo $PROCS procesos (se esperan >1.000.000). ¿Arrancó vacía tras una corrupción?"
            exit 1
          fi

          # El barrido corre martes y jueves. 10 días de margen cubre un fallo aislado
          # sin generar ruido, y grita si la sincronización está muerta de verdad.
          LIMITE=$(date -u -d '10 days ago' +%Y-%m-%d)
          echo "corte=$CUTOFF  limite=$LIMITE  procesos=$PROCS"
          if [ "$CUTOFF" \< "$LIMITE" ]; then
            echo "::error::Datos estancados: el corte es $CUTOFF y el límite aceptable era $LIMITE. Revisa sync.log y la tarea 'OICP Sync SERCOP'."
            exit 1
          fi
          echo "Datos frescos"
