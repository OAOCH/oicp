name: CI

# Typecheck (servidor Y cliente) + build + tests en cada push y PR.
#
# Estos pasos FALLAN de verdad. Antes llevaban `continue-on-error: true`, así que el CI
# quedaba verde aunque los 21 tests del motor de banderas o el typecheck estuvieran
# rotos: el peor de los dos mundos, porque el check verde daba una garantía falsa.
# Un check rojo NO bloquea el despliegue (Railway observa el repo, no el CI), así que
# esto no frena a nadie; solo deja de mentir.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck servidor y cliente
        run: npm run typecheck
      - name: Build frontend
        run: npx vite build
      - name: Tests
        run: npm test
